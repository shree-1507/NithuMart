<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Seller Dashboard - NithuMart</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>


<body>


<header>

    <h1>NithuMart - Seller</h1>

    <nav>

        <a href="seller.html">
            Dashboard
        </a>

        <a href="index.html">
            Logout
        </a>

    </nav>

</header>



<main>


    <!-- ========================= -->
    <!-- SELLER DASHBOARD -->
    <!-- ========================= -->

    <section>

        <h2>Seller Dashboard</h2>

        <p>Welcome, Seller!</p>

        <p id="sellerName"></p>

    </section>



    <!-- ========================= -->
    <!-- ADD PRODUCT -->
    <!-- ========================= -->

    <section class="form-container">

        <h2>Add Product</h2>


        <form id="productForm">


            <!-- PRODUCT NAME -->

            <label>
                Product Name
            </label>

            <input
                type="text"
                id="productName"
                placeholder="Enter product name"
                required
            >



            <!-- DESCRIPTION -->

            <label>
                Product Description
            </label>

            <textarea
                id="productDescription"
                placeholder="Enter product description"
                rows="4"
                required
            ></textarea>



            <!-- PRICE -->

            <label>
                Price
            </label>

            <input
                type="number"
                id="productPrice"
                min="0"
                placeholder="Enter price"
                required
            >



            <!-- CATEGORY -->

            <label>
                Category
            </label>

            <input
                type="text"
                id="productCategory"
                placeholder="Enter product category"
                required
            >



            <!-- STOCK -->

            <label>
                Stock
            </label>

            <input
                type="number"
                id="productStock"
                min="0"
                placeholder="Enter stock quantity"
                required
            >



            <!-- ADD BUTTON -->

            <button type="submit">
                Add Product
            </button>


        </form>


        <p id="productMessage"></p>


    </section>



    <!-- ========================= -->
    <!-- MY PRODUCTS -->
    <!-- ========================= -->

    <section>

        <h2>My Products</h2>


        <div id="sellerProducts">

            <p>
                Loading products...
            </p>

        </div>


    </section>



    <!-- ========================= -->
    <!-- SELLER ORDERS -->
    <!-- ========================= -->

    <section>

        <h2>Received Orders</h2>


        <div id="sellerOrders">

            <p>
                Loading orders...
            </p>

        </div>


    </section>


</main>



<!-- ========================= -->
<!-- JAVASCRIPT -->
<!-- ========================= -->

<script src="../js/app.js"></script>


</body>

</html>
